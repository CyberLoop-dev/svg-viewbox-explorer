<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>SVG ViewBox Explorer</title><link rel="stylesheet" href="/styles.css"></head><body><main><header class="hero"><div><div class="eyebrow">SVG VIEWBOX EXPLORER</div><h1>SVG ViewBox Explorer</h1><p>An interactive SVG viewport lab for viewBox dimensions and preserveAspectRatio alignment modes.</p></div><img class="mark" src="/assets/mark.svg" alt=""></header><section class="panel"><div class="grid"><div class="field"><label for="vw">viewBox width</label><input id="vw" type="number" min="20" max="300" value="100"></div><div class="field"><label for="vh">viewBox height</label><input id="vh" type="number" min="20" max="300" value="100"></div><div class="field"><label for="align">preserveAspectRatio</label><select id="align"><option>xMidYMid meet</option><option>xMinYMin meet</option><option>xMaxYMax meet</option><option>xMidYMid slice</option><option>none</option></select></div></div><div class="controls"><button id="apply" class="primary">Apply viewBox</button><button id="reset">Reset</button></div><p class="pill" id="attrs">viewBox="0 0 100 100"</p><svg id="demo" width="100%" height="330" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#29415d" stroke-width=".5"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)"/><circle cx="50" cy="50" r="35" fill="#0ea5e9" fill-opacity=".18" stroke="#38bdf8" stroke-width="2"/><rect x="18" y="18" width="64" height="64" fill="none" stroke="#a78bfa" stroke-width="2"/><path d="M0 50H100M50 0V100" stroke="#e2e8f0" stroke-opacity=".7" stroke-dasharray="3 3"/><text x="50" y="54" fill="#fff" font-size="8" text-anchor="middle">SVG VIEWPORT</text></svg></section><footer>Local-first learning tool · No account · No uploads</footer></main><script type="module" src="/app.js"></script></body></html>
